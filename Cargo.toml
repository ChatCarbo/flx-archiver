[package]
name = "flx-archiver"
version = "0.1.0"
edition = "2021"
authors = ["ChatCarbo"]

[dependencies]
eframe = "0.28.1"
egui = "0.28.1"
tokio = { version = "1.38", features = ["full"] }
zip = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
tempfile = "3.10"
tracing = "0.1"
tracing-subscriber = "0.3"
rfd = "0.14" # Boîtes de dialogue de fichiers Windows
sevenz-rust = "0.5"
zstd = "0.13"
unrar = "0.5"
walkdir = "2.5"
flate2 = "1.0"
num_cpus = "1.16"
tar = "0.4.46"
image = { version = "0.24", features = ["png"] }
egui_extras = "0.28.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
